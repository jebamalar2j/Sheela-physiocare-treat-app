function proteinBlock(type, dietType) {
  if (dietType === "veg") {
    switch (type) {
      case "egg": return { breakfastAdd: "Paruppu podi (1 tbsp) with dosa", lunchProtein: "Extra paruppu kuzhambu (1 cup) + curd" };
      case "chicken": return { breakfastAdd: "Sprouts sundal (1/2 cup)", lunchProtein: "Soya chunk curry (25g dry soya)" };
      case "fish": return { breakfastAdd: "Sprouts sundal (1/2 cup)", lunchProtein: "Paneer curry (60g paneer)" };
      default: return { breakfastAdd: "Sprouts sundal (1/2 cup)", lunchProtein: "Kadala (chickpea) curry (3/4 cup)" };
    }
  }
  switch (type) {
    case "egg": return { breakfastAdd: "1 boiled egg", lunchProtein: "Paruppu kuzhambu (1 cup) + curd" };
    case "chicken": return { breakfastAdd: "Sprouts sundal (1/2 cup)", lunchProtein: "Chicken curry (75–90g cooked, skinless)" };
    case "fish": return { breakfastAdd: "Sprouts sundal (1/2 cup)", lunchProtein: "Fish or prawn curry (75–90g cooked)" };
    default: return { breakfastAdd: "Sprouts sundal (1/2 cup)", lunchProtein: "Kadala (chickpea) curry (3/4 cup)" };
  }
}

const GUT_TIPS = [
  "Let idli/dosa batter ferment a full 8–12 hours (not just 4–5) — the longer natural fermentation builds a more diverse microbial community in the batter itself.",

function buildPlan(dietType) {
  const days = [];
  for (let i = 1; i <= 14; i++) {
    const idx = (i - 1) % 7;
    const type = PROTEIN_CYCLE[idx];
    const pb = proteinBlock(type, dietType);
    days.push({
      day: i,
      breakfast: BREAKFASTS[idx],

}

/* ---------------------------------------------------------
   CALCULATIONS
--------------------------------------------------------- */

const ACTIVITY_LEVELS = {
  sedentary: {
    label: "Sedentary",
    detail: "Desk-based work or mostly seated day, minimal walking",
    multiplier: 1.2,
  },
  home: {
    label: "Home-based / homemaker",
    detail: "Cooking, cleaning, childcare — a lot of standing and moving around, but no continuous exercise",
    multiplier: 1.3,
  },
  moderate: {
    label: "Moderate",
    detail: "A structured walk or exercise session most days (30–45 min) on top of normal daily movement",
    multiplier: 1.45,
  },
  vigorous: {
    label: "Vigorous",
    detail: "Physically demanding job (manual labour, fieldwork) or intense/frequent exercise",
    multiplier: 1.65,
  },
};

function computeTargets({ age, sex, weight, height, goal, activity, comorbidities = [], medications = "", gutSymptoms = [] }) {
  const w = parseFloat(weight) || 0;
  const h = parseFloat(height) || 0;
  const a = parseFloat(age) || 0;
  if (!w || !h || !a) return null;

  const activityKey = ACTIVITY_LEVELS[activity] ? activity : "home";
  const activityMultiplier = ACTIVITY_LEVELS[activityKey].multiplier;

  const bmr = sex === "male" ? 10 * w + 6.25 * h - 5 * a + 5 : 10 * w + 6.25 * h - 5 * a - 161;
  const tdee = bmr * activityMultiplier;

  let calorieAdjust = 0;
  let proteinPerKg;
  const elderly = a >= 60;

  if (goal === "weightloss") {
    calorieAdjust = -500;
    proteinPerKg = elderly ? 1.5 : 1.4;
  } else if (goal === "fatloss") {
    calorieAdjust = -250;
    proteinPerKg = elderly ? 1.6 : 1.6;
  } else {
    // insulin sensitivity, ideal body weight, maintenance
    calorieAdjust = 0;
    proteinPerKg = elderly ? 1.2 : 1.0;
  }

  const hasKidneyDisease = comorbidities.includes("kidney");
  if (hasKidneyDisease) {
    // Kidney disease calls for conservative, individualised protein — override the goal-based bump
    proteinPerKg = Math.min(proteinPerKg, 0.8);
  }

  const medText = (medications || "").toLowerCase();
  const hypoRiskDrugs = ["insulin", "glimepiride", "gliclazide", "glyburide", "glibenclamide", "glipizide", "sulfonylurea"];
  const onHypoRiskDrug = hypoRiskDrugs.some((d) => medText.includes(d));

  const possibleLactose = gutSymptoms.includes("lactose");
  const possibleGluten = gutSymptoms.includes("gluten");
  const possibleIBS = gutSymptoms.includes("ibs_pain") || (gutSymptoms.includes("fodmap") && gutSymptoms.length >= 2);

  const calories = Math.max(1200, Math.round(tdee + calorieAdjust));
  const proteinG = Math.round(proteinPerKg * w);
  const proteinKcal = proteinG * 4;
  const carbPct = 0.55; // midpoint of 50-60%
  const carbKcal = calories * carbPct;
  const carbG = Math.round(carbKcal / 4);
  const fatKcal = Math.max(calories - proteinKcal - carbKcal, calories * 0.2);
  const fatG = Math.round(fatKcal / 9);

  return {
    bmr: Math.round(bmr),
    tdee: Math.round(tdee),
    calories,
    proteinG,
    carbG,
    fatG,
    elderly,
    activityKey,
    hasKidneyDisease,
    onHypoRiskDrug,
    possibleLactose,
    possibleGluten,
    possibleIBS,
    split: {
      breakfastCarb: Math.round(carbG * 0.2),
      lunchCarb: Math.round(carbG * 0.4),
      dinnerCarb: Math.round(carbG * 0.3),
      snackCarb: Math.round(carbG * 0.1),
    },
  };
}

/* ---------------------------------------------------------
   KOLAM DOT DIVIDER (signature element)
--------------------------------------------------------- */
function KolamDivider({ color = "#D9AEE0" }) {
  const dots = Array.from({ length: 13 });
  return (
    <svg width="100%" height="18" viewBox="0 0 260 18" preserveAspectRatio="xMidYMid meet" style={{ display: "block", margin: "0 auto" }}>
      {dots.map((_, i) => {
        const x = 10 + i * 20;
        return <circle key={i} cx={x} cy="9" r="2.4" fill={color} opacity={i % 2 === 0 ? 0.9 : 0.4} />;
      })}
      {dots.slice(0, -1).map((_, i) => {
        const x1 = 10 + i * 20;
        const x2 = 10 + (i + 1) * 20;
        return <path key={"p" + i} d={`M ${x1} 9 Q ${x1 + 10} ${i % 2 === 0 ? -2 : 20} ${x2} 9`} stroke={color} strokeWidth="1" fill="none" opacity="0.35" />;
      })}
    </svg>
  );
}

    setPwError("Checking…");

        body: JSON.stringify({ action: "checkPassword", password: pwInput }),

      setPwError("Couldn't reach the server to verify the password. Try again in a moment.");

              <button onClick={saveRecord} style={styles.exportBtn}>
                Save this patient
              </button>
              <button onClick={fetchSavedList} style={{ ...styles.exportBtn, background: "#8B5FB0" }}>
                Refresh saved list
              </button>
              {saveStatus && <span style={{ fontSize: 13, color: COLORS.muted }}>{saveStatus}</span>}
            </div>
            {listStatus && <p style={styles.note}>{listStatus}</p>}
            {savedList.length > 0 && (
              <div style={{ ...styles.checkGridSingle, marginTop: 10 }}>

                  <button key={i} onClick={() => loadRecord(r)} style={styles.savedRow}>
                    <b>{r.name || "(no name)"}</b> — {r.age} yrs, {r.sex} · {r.timestamp ? new Date(r.timestamp).toLocaleDateString("en-IN") : ""}
                  </button>
                ))}
              </div>
            )}

        )}
      </div>

      <div style={styles.card}>
        <h2 style={styles.h2}>Tell me about the person eating</h2>
        <div style={styles.grid2}>
          <Field label="Patient ID">
            <input
              type="text"
              value={profile.patientId}
              onChange={update("patientId")}
              placeholder="e.g. SP-0001"
              style={styles.input}
            />
          </Field>
          <Field label="Name">
            <input type="text" value={profile.name} onChange={update("name")} placeholder="Optional" style={styles.input} />
          </Field>
          <Field label="Occupation">
            <input
              type="text"
              value={profile.occupation}
              onChange={update("occupation")}
              placeholder="e.g. Homemaker, Field health worker"
              style={styles.input}
            />
          </Field>
          <Field label="Age (years)">
            <input type="number" min="18" value={profile.age} onChange={update("age")} style={styles.input} />
          </Field>
          <Field label="Gender">
            <select value={profile.sex} onChange={update("sex")} style={styles.input}>
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </Field>
          <Field label="Weight (kg)">
            <input type="number" value={profile.weight} onChange={update("weight")} style={styles.input} />
          </Field>
          <Field label="Height (cm)">
            <input type="number" value={profile.height} onChange={update("height")} style={styles.input} />
          </Field>
          <Field label="Diabetes / prediabetes?">
            <select value={profile.diabetes} onChange={update("diabetes")} style={styles.input}>
              <option value="no">No</option>
              <option value="yes">Yes</option>
            </select>
          </Field>
          <Field label="Primary goal">
            <select value={profile.goal} onChange={update("goal")} style={styles.input}>
              <option value="weightloss">Weight reduction (overweight/obese)</option>
              <option value="fatloss">Fat reduction / recomposition</option>
              <option value="insulin">Improve insulin sensitivity (already near ideal weight)</option>
            </select>
          </Field>
          <Field label="Daily activity level">
            <select value={profile.activity} onChange={update("activity")} style={styles.input}>
              <option value="sedentary">Sedentary — desk job, mostly seated</option>
              <option value="home">Home-based — housework, cooking, childcare</option>
              <option value="moderate">Moderate — structured walk/exercise most days</option>
              <option value="vigorous">Vigorous — manual labour or intense exercise</option>
            </select>
          </Field>
        </div>
        <p style={styles.note}>
          "Home-based" is deliberately kept close to sedentary. Running a household — cooking, cleaning, standing,
          childcare — is genuinely tiring and involves a lot of time on your feet, but it doesn't burn calories the
          way continuous, structured exercise does. Rating it as "moderate activity" would overestimate calorie needs
          and quietly stall weight loss. If a real daily walk or workout is added on top of housework, choose
          "Moderate" instead.
        </p>

        <div style={{ marginTop: 16 }}>
          <span style={styles.fieldLabel}>Existing health conditions</span>
          <div style={styles.checkGrid}>
            {COMORBIDITY_OPTIONS.map((c) => (
              <label key={c.key} style={styles.checkItem}>
                <input type="checkbox" checked={profile.comorbidities.includes(c.key)} onChange={toggleComorbidity(c.key)} />
                <span>{c.label}</span>
              </label>
            ))}
          </div>
          <div style={{ marginTop: 8 }}>
            <Field label="Others, please specify">
              <input
                type="text"
                value={profile.comorbiditiesOther}
                onChange={update("comorbiditiesOther")}
                placeholder="e.g. Fatty liver, migraine"
                style={styles.input}
              />
            </Field>
          </div>
        </div>

        <div style={{ marginTop: 16 }}>
          <Field label="Medicines currently taken (comma separated)">
            <input
              type="text"
              value={profile.medications}
              onChange={update("medications")}
              placeholder="e.g. Metformin, Glimepiride, Thyroxine"
              style={styles.input}
            />
          </Field>
        </div>

        <div style={{ marginTop: 16 }}>
          <span style={styles.fieldLabel}>Gut symptom screen (tick any that apply)</span>
          <div style={styles.checkGridSingle}>
            {GUT_SCREEN_OPTIONS.map((g) => (
              <label key={g.key} style={styles.checkItem}>
                <input type="checkbox" checked={profile.gutSymptoms.includes(g.key)} onChange={toggleGutSymptom(g.key)} />
                <span>{g.label}</span>
              </label>
            ))}
          </div>
        </div>

        <div style={{ marginTop: 16 }}>
          <Field label="Contact for patient queries (shown on printout)">
            <input
              type="text"
              value={profile.contactEmail}
              onChange={update("contactEmail")}
              placeholder="clinic email or phone"
              style={styles.input}
            />
          </Field>
        </div>

        {profile.age && parseFloat(profile.age) < 18 && (
          <p style={{ color: "#C21F2B", fontWeight: 600 }}>This chart is designed for adults 18 and above only.</p>
        )}
      </div>

      {targets && (
        <div style={styles.card}>
          <h2 style={styles.h2}>{profile.name ? `Daily targets for ${profile.name}` : "Daily targets"}</h2>

          {targets.onHypoRiskDrug && (
            <div style={styles.reviewBox}>
              <b>Flag for review:</b> hypoglycemia-risk medicine on file (insulin or a sulfonylurea). Confirm dose
              timing against the lighter breakfast-carb portion before finalising this chart for the patient.
            </div>
          )}
          {targets.hasKidneyDisease && (
            <div style={styles.reviewBox}>
              <b>Flag for review:</b> kidney disease on file — protein has been held at a conservative 0.8 g/kg
              rather than raised for the weight/fat-loss goal. Adjust to the patient's actual stage before finalising.
            </div>
          )}
          {targets.possibleLactose && (
            <div style={styles.reviewBox}>
              <b>Gut screen — possible lactose intolerance:</b> consider a trial cutting back milk/ice cream first.
              Curd and buttermilk are usually better tolerated (fermentation breaks down much of the lactose) and can
              stay in the chart.
            </div>
          )}
          {targets.possibleGluten && (
            <div style={styles.reviewBox}>
              <b>Gut screen — possible gluten sensitivity:</b> this chart already leans on rice and millets, which
              helps. If coeliac disease is suspected, check tTG-IgA before any gluten restriction starts — testing
              needs gluten still in the diet to be accurate.
            </div>
          )}
          {targets.possibleIBS && (
            <div style={styles.reviewBox}>
              <b>Gut screen — possible IBS pattern:</b> consider a supervised low-FODMAP trial. The high vegetable
              and fibre diversity in this chart may need individualising — bulk fibre can worsen IBS-D in some
              patients.
            </div>
          )}

          <div style={styles.targetGrid}>
            <TargetBox
              label="Calories"
              value={`${targets.calories} kcal/day`}
              note={`Maintenance ≈ ${targets.tdee} kcal, based on "${ACTIVITY_LEVELS[targets.activityKey].label}" activity`}
            />
            <TargetBox label="Carbohydrate" value={`${targets.carbG} g/day (~55%)`} note="Spread lighter at breakfast, more at lunch" />
            <TargetBox label="Protein" value={`${targets.proteinG} g/day`} note={targets.elderly ? "Higher target — adults 60+ need more protein per kg to counter age-related muscle loss (anabolic resistance)" : "Split evenly across 3–4 meals for muscle upkeep"} />
            <TargetBox label="Fat" value={`${targets.fatG} g/day`} note="Not restricted — needed for satiety and vitamin absorption" />
          </div>
          <h3 style={styles.h3}>How to spend the carbs across the day</h3>
          <div style={styles.splitRow}>
            <SplitChip label="Breakfast" value={`~${targets.split.breakfastCarb} g`} />
            <SplitChip label="Mid-morning" value={`~${targets.split.snackCarb} g`} />
            <SplitChip label="Lunch" value={`~${targets.split.lunchCarb} g`} />
            <SplitChip label="Dinner" value={`~${targets.split.dinnerCarb} g`} />
          </div>
          <p style={styles.note}>
            Breakfast is deliberately the lightest carb meal — insulin resistance is typically highest in the morning
            (the body's natural "dawn" pattern), so breakfast here leans on egg/protein and a smaller carb portion,
            and the largest carb share moves to lunch when activity and insulin sensitivity are usually better.
          </p>
          <p style={styles.note}>
            Use the serving sizes in the <b>Substitution guide</b> tab to translate these grams into the actual dosa,
            rice, dal and oil amounts on your plate.
          </p>
        </div>
      )}
    </section>
  );
}

function Field({ label, children }) {
  return (
    <label style={styles.field}>
      <span style={styles.fieldLabel}>{label}</span>
      {children}
    </label>
  );
}

function TargetBox({ label, value, note }) {
  return (
    <div style={styles.targetBox}>
      <div style={styles.targetLabel}>{label}</div>
      <div style={styles.targetValue}>{value}</div>
      <div style={styles.targetNote}>{note}</div>
    </div>

}

function SplitChip({ label, value }) {
  return (
    <div style={styles.splitChip}>
      <div style={{ fontSize: 12, color: "#6B5C7A" }}>{label}</div>
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 18, color: "#6B3FA0", fontWeight: 600 }}>{value}</div>
    </div>

}

/* ---------------------------------------------------------
   CHART TAB
--------------------------------------------------------- */
function ChartTab({ dietType, setDietType, plan, selectedDay, setSelectedDay, dayData, targets }) {
  return (
    <section>
      <div style={styles.card}>
        <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 12, alignItems: "center" }}>
          <h2 style={styles.h2}>14-day chart</h2>
          <div style={styles.segment}>

          {plan.map((d) => (
            <button

              {d.day}
              {d.cheat && <span style={styles.cheatDot} title="Cheat sweet day" />}
            </button>
          ))}
        </div>
        <p style={{ fontSize: 12, color: "#6B5C7A" }}>
          <span style={styles.cheatDot} /> marks a planned cheat-sweet day (days 4, 9, 14) — a small, timed treat so
          restriction doesn't build into a binge.
        </p>
      </div>

      {dayData && (
        <div style={styles.card}>
          <h3 style={styles.h3}>Day {dayData.day}</h3>

          <MealBlock title="Breakfast" items={[dayData.breakfast.name, dayData.breakfast.side, dayData.breakfastAdd]} />
          <MealBlock title="Mid-morning" items={[dayData.midMorning]} />
          <MealBlock
            title="Lunch"
            items={[dayData.lunchCarb, dayData.lunchGravy, dayData.poriyal, dayData.lunchProtein, "Buttermilk or curd, small cup"]}
          />
          <MealBlock title="Evening snack" items={[dayData.eveningSnack]} />
          <MealBlock title="Dinner (earlier, ~7–7:30pm where possible)" items={[dayData.dinnerCarb, dayData.dinnerKootu, dayData.dinnerProtein]} />

            <div style={styles.cheatBox}>

          )}

          <div style={styles.walkBox}>
            <b>Walk after lunch and dinner:</b> 10–15 minutes at an easy pace, starting within 30 minutes of finishing
            the meal. Working muscle pulls glucose out of the blood without needing extra insulin, which blunts the

          <div style={styles.orderBox}>
            <b>Order to eat this meal in:</b> protein/fat first (egg, chicken, fish, paneer, dal, curd) → vegetable
            side → rice/millet/chapati last. If there's a sweet today, it comes after the full meal, not before or
            in place of it.

          <div style={styles.gutBox}>
            <b>Gut tip:</b> {dayData.gutTip}
          </div>
        </div>

    </section>
  );
}

function MealBlock({ title, items }) {
  const filtered = items.filter((i) => i && i !== "—");
  return (
    <div style={styles.mealBlock}>
      <div style={styles.mealTitle}>{title}</div>
      <ul style={styles.mealList}>
        {filtered.map((it, i) => (
          <li key={i}>{it}</li>
        ))}
      </ul>
    </div>
  );
}

/* ---------------------------------------------------------
   PRINCIPLES TAB
--------------------------------------------------------- */
function PrinciplesTab() {
  return (
    <section>
      <div style={styles.card}>
        <h2 style={styles.h2}>Principles behind the chart</h2>

        <h3 style={styles.h3}>1. Carbs never travel alone</h3>
        <p style={styles.note}>
          Every carb serving on this chart sits next to protein, fat, or fibre — dosa with egg, rice with sambar and
          curd, chapati with kootu. Eaten alone, a carb spikes blood sugar fast; paired, the rise is slower and lower.
        </p>

        <h3 style={styles.h3}>2. Order of eating, within a meal</h3>
        <p style={styles.note}>
          Protein and fat first (egg, chicken, fish, paneer, dal, curd) → vegetable → rice/millet/chapati last. If a
          sweet is on the menu that day, it comes at the very end, after the full meal — never on an empty stomach.
        </p>

        <h3 style={styles.h3}>3. Breakfast carries the least carb, not the most</h3>
        <p style={styles.note}>
          Insulin resistance is usually at its worst first thing in the morning. This chart keeps breakfast leaning on
          egg/protein with a modest carb portion, and shifts the largest carb share to lunch.
        </p>

        <h3 style={styles.h3}>4. Walk it off</h3>
        <p style={styles.note}>
          A 10–15 minute walk within 30 minutes of lunch and dinner lets contracting muscle pull glucose out of the
          blood directly, on top of whatever insulin is doing. This is one of the few free, zero-cost tools available
          to everyone regardless of diet.
        </p>

        <h3 style={styles.h3}>5. Real food, adequate fat, no fear of yolks or ghee</h3>
        <p style={styles.note}>
          In the spirit of the "real food" approach popularised by nutrition writer Lily Nichols for blood-sugar
          management: whole eggs (yolk included), curd, ghee and nuts in modest, portioned amounts are part of the
          plan, not the enemy. Cutting fat usually just pushes the plate toward more refined carbs, which is the
          opposite of the goal here.
        </p>

        <h3 style={styles.h3}>6. A cheat sweet is scheduled, not confessed</h3>
        <p style={styles.note}>
          Every 4–5 days, a small, specific sweet appears on the chart on purpose (days 4, 9, 14), timed after a
          balanced meal and a walk. Constant restriction is what usually leads to bingeing later — a planned,
          portioned treat removes the pressure that builds around it.
        </p>

        <h3 style={styles.h3}>7. Non-veg priority: egg, then chicken, then seafood</h3>
        <p style={styles.note}>
          Red meat (mutton/beef) is left off the chart. Eggs are the cheapest, most convenient protein and appear
          most often, chicken next, seafood where affordable and fresh locally.
        </p>

        <h3 style={styles.h3}>8. No elaborate prep, no weekly meal-prep Sundays</h3>
        <p style={styles.note}>
          Every dish here is a normal, everyday Tamil Nadu kitchen item — no all-day chopping of salad vegetables, no
          soaking-and-blending smoothies, no batch-cooking a week ahead. Sprouts are the one "prep" item: soak dried
          legumes overnight, tie in a damp cloth for a day, and they're ready to use for 2–3 days.
        </p>

        <h3 style={styles.h3}>9. What this chart deliberately leaves out</h3>
        <p style={styles.note}>
          No fruit juices, smoothies, or soups as meal replacements — they spike sugar fast and don't fill you up the
          way chewing solid food does. No watermelon or cucumber counted as a "snack" on their own — they're mostly
          water, and won't hold off hunger for someone actually watching intake. Whole fruit appears, but always
          paired with a handful of nuts.
        </p>

        <h3 style={styles.h3}>10. Kept affordable</h3>
        <p style={styles.note}>
          The chart leans on dal, egg, seasonal local vegetables, curd, and millets already common in Tamil Nadu
          households, rather than imported "health foods," protein powders, or specialty low-carb products.
        </p>
      </div>
    </section>
  );
}

            into the central nervous system.
          </li>
          <li>
            <b>Serotonin, more precisely:</b> around 90% of the body's serotonin is made in the gut, but it acts
            mainly there — on gut motility and on vagal nerve endings — rather than crossing directly into the
            brain's own serotonin pool. The common claim that "gut serotonin is brain serotonin" oversimplifies this;
            the real link is that gut serotonin signals the brain indirectly, via the vagus nerve.
          </li>
          <li>
            <b>The stress loop:</b> chronic stress raises cortisol, which can loosen the gut's tight junctions and
            slow or speed up motility. That shifts the bacterial balance (dysbiosis), which produces more
            inflammatory signalling, which feeds back to affect mood and stress reactivity — a genuine two-way loop,
            not just "stress causes gut problems."
          </li>
        </ul>
        <p style={styles.note}>
          What this means practically: gut-directed changes (fibre diversity, fermented foods, regular meals, less
          ultra-processed food) are a legitimate lever for systemic inflammation and, through that, for mood and

        </p>

          <li>Cut back on packaged snacks, biscuits, and refined-maida items — this chart already does most of that work by design.</li>
          <li>Protect sleep (7+ hours) and keep meal times reasonably regular — both reduce the cortisol-driven side of the stress loop above.</li>
          <li>The daily post-meal walk already recommended in this chart also supports gut motility and microbial diversity, on top of its blood-sugar benefit.</li>
        </ul>
      </div>

      <div style={styles.card}>
        <h2 style={styles.h2}>Local fermented food over imported probiotics</h2>
        <p style={styles.note}>
          This chart favours fermented foods native to the Tamil kitchen — long-fermented idli/dosa batter,
          buttermilk, curd, traditional pickles in moderation — over imported probiotic capsules or foreign yogurt
          cultures. Naturally fermented local foods carry a diverse community of microbes already adapted to the
          local diet, water, and environment, which tends to establish and persist better than a handful of isolated
          commercial strains shipped in from elsewhere. This is a reasonable, evidence-informed preference rather
          than a settled fact for every strain and every patient — but as a default, food-based and local beats
          supplement-based and imported.
        </p>
      </div>
